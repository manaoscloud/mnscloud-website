name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  website:
    name: Website build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Translation check
        run: npm run check:i18n
      - name: Build
        run: npm run build
      - name: Official domain boundary
        run: npm run check:domains
      - name: Install Chromium for the browser checks
        run: npx playwright install --with-deps chromium
      - name: Responsive and cookie consent checks
        run: |
          npx astro preview --host 127.0.0.1 --port 4321 &
          for _ in $(seq 1 60); do curl -fs -o /dev/null http://127.0.0.1:4321/ && break; sleep 1; done
          RESPONSIVE_CHECK_BASE_URL=http://127.0.0.1:4321 npm run check:responsive
          RESPONSIVE_CHECK_BASE_URL=http://127.0.0.1:4321 npm run check:cookies
