name: Build Website Artifact

on:
  workflow_dispatch:
    inputs:
      public_site_url:
        description: "Optional public site URL used for canonical/sitemap generation"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-artifact:
    name: Build downloadable website package
    runs-on: ubuntu-latest
    env:
      PUBLIC_SITE_URL: ${{ inputs.public_site_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate domain boundaries
        run: npm run check:domains

      - name: Build static website
        run: npm run build

      - name: Upload website artifact
        uses: actions/upload-artifact@v7
        with:
          name: mnscloud-website-dist-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
