backend:
  name: github
  repo: manaoscloud/mnscloud-website
  branch: main

local_backend: true
publish_mode: editorial_workflow

media_folder: "public/uploads"
public_folder: "/uploads"

site_url: "/"
display_url: "/"
logo_url: "/brand/mnscloud-logo.png"

# Languages: pt-BR (default, served at /), en-US (/en/), es-ES (/es/). See README "Languages (i18n)".
# Blog posts use Decap i18n (multiple_folders -> src/content/blog/<locale>/<slug>.md). Decap file
# collections only support the single_file structure, so the per-locale site JSON files are edited
# through one "Site Content" collection per language that shares the same field definitions.
i18n:
  structure: multiple_folders
  locales: [pt-BR, en-US, es-ES]
  default_locale: pt-BR

collections:
  - name: "identity"
    label: "Site Identity (all languages)"
    files:
      - label: "Identity And Brand"
        name: "identity"
        file: "src/content/site/settings.json"
        fields:
          - label: "Site"
            name: "site"
            widget: "object"
            fields:
              - { label: "Site name", name: "name", widget: "string" }
              - { label: "Site URL", name: "url", widget: "string" }
              - { label: "Open Graph image", name: "ogImage", widget: "image", required: false }
          - label: "Brand"
            name: "brand"
            widget: "object"
            fields:
              - { label: "Light logo", name: "logoLight", widget: "image" }
              - { label: "Default logo", name: "logoDefault", widget: "image" }
              - { label: "Favicon", name: "favicon", widget: "image" }
              - { label: "Watermark", name: "watermark", widget: "image", required: false }
  - name: "site_pt_br"
    label: "Site Content - Português (pt-BR)"
    files:
      - label: "Global Settings"
        name: "settings"
        file: "src/content/site/pt-BR/settings.json"
        fields: &settings_fields
          - label: "Site"
            name: "site"
            widget: "object"
            fields:
              - { label: "Default title", name: "defaultTitle", widget: "string" }
              - { label: "Default description", name: "defaultDescription", widget: "text" }
          - label: "Brand"
            name: "brand"
            widget: "object"
            fields:
              - { label: "Hero image alt", name: "heroAlt", widget: "string" }
          - label: "Navigation"
            name: "navigation"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL", name: "href", widget: "string" }
          - label: "Header CTA"
            name: "headerCta"
            widget: "object"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL", name: "href", widget: "string" }
          - label: "Footer"
            name: "footer"
            widget: "object"
            fields:
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Copyright", name: "copyright", widget: "string" }
              - { label: "Note", name: "note", widget: "string" }
              - label: "Legal links"
                name: "legalLinks"
                widget: "list"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "URL", name: "href", widget: "string" }
          - label: "Global CTA"
            name: "globalCta"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Button label", name: "buttonLabel", widget: "string" }
              - { label: "Button URL", name: "buttonHref", widget: "string" }
      - label: "Home Page"
        name: "home"
        file: "src/content/site/pt-BR/home.json"
        fields: &home_fields
          - { label: "SEO title", name: "seoTitle", widget: "string" }
          - { label: "SEO description", name: "seoDescription", widget: "text" }
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - label: "Primary action"
                name: "primaryAction"
                widget: "object"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "URL", name: "href", widget: "string" }
              - label: "Secondary action"
                name: "secondaryAction"
                widget: "object"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "URL", name: "href", widget: "string" }
              - label: "Panel rows"
                name: "panelRows"
                widget: "list"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Value", name: "value", widget: "string" }
          - label: "Modules section"
            name: "modulesSection"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - label: "Technology ecosystem section"
            name: "ecosystemSection"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Trademark disclaimer", name: "disclaimer", widget: "text" }
              - label: "Rows"
                name: "rows"
                widget: "list"
                fields:
                  - { label: "Row label", name: "label", widget: "string" }
                  - label: "Direction"
                    name: "direction"
                    widget: "select"
                    options: ["left", "right"]
                  - label: "Items"
                    name: "items"
                    widget: "list"
                    fields:
                      - { label: "Name", name: "name", widget: "string" }
                      - { label: "Category", name: "category", widget: "string" }
          - label: "Architecture band"
            name: "architectureBand"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - label: "Blog section"
            name: "blogSection"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "All posts eyebrow", name: "allPostsEyebrow", widget: "string" }
              - { label: "All posts title", name: "allPostsTitle", widget: "string" }
              - { label: "All posts text", name: "allPostsText", widget: "text" }
      - label: "Product Modules"
        name: "modules"
        file: "src/content/site/pt-BR/modules.json"
        fields: &modules_fields
          - label: "Modules"
            name: "modules"
            widget: "list"
            fields:
              - { label: "Slug", name: "slug", widget: "string" }
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Summary", name: "summary", widget: "text" }
              - { label: "URL", name: "href", widget: "string" }
              - label: "Features"
                name: "features"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
      - label: "Core Pages"
        name: "pages"
        file: "src/content/site/pt-BR/pages.json"
        fields: &pages_fields
          - label: "Blog"
            name: "blog"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Lead", name: "lead", widget: "text" }
              - { label: "Back label", name: "backLabel", widget: "string" }
              - { label: "Article eyebrow", name: "articleEyebrow", widget: "string" }
              - { label: "Article CTA title", name: "articleCtaTitle", widget: "string" }
              - { label: "Blog index CTA title", name: "indexCtaTitle", widget: "string" }
          - label: "API Docs"
            name: "docs"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Lead", name: "lead", widget: "text" }
              - label: "Primary action"
                name: "primaryAction"
                widget: "object"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "URL", name: "href", widget: "string" }
              - label: "Secondary action"
                name: "secondaryAction"
                widget: "object"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "URL", name: "href", widget: "string" }
              - { label: "Surfaces title", name: "surfacesTitle", widget: "string" }
              - label: "Surfaces"
                name: "surfaces"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Text", name: "text", widget: "string" }
              - { label: "Section eyebrow", name: "sectionEyebrow", widget: "string" }
              - { label: "Section title", name: "sectionTitle", widget: "string" }
              - { label: "Section text", name: "sectionText", widget: "text" }
              - label: "Cards"
                name: "cards"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Text", name: "text", widget: "text" }
              - { label: "CTA title", name: "ctaTitle", widget: "string" }
          - label: "Developers"
            name: "developers"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Lead", name: "lead", widget: "text" }
              - label: "Repositories"
                name: "repositories"
                widget: "list"
                fields:
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
                  - { label: "URL", name: "url", widget: "string" }
              - { label: "Governance eyebrow", name: "governanceEyebrow", widget: "string" }
              - { label: "Governance title", name: "governanceTitle", widget: "string" }
              - { label: "Governance text", name: "governanceText", widget: "text" }
              - { label: "Boundary title", name: "boundaryTitle", widget: "string" }
              - { label: "Boundary text", name: "boundaryText", widget: "text" }
              - { label: "CTA title", name: "ctaTitle", widget: "string" }
          - label: "Page not found (404)"
            name: "notFound"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Lead", name: "lead", widget: "text" }
              - label: "Links"
                name: "links"
                widget: "list"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "URL", name: "href", widget: "string" }
          - label: "Security"
            name: "security"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Lead", name: "lead", widget: "text" }
              - label: "Cards"
                name: "cards"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Text", name: "text", widget: "text" }
              - { label: "CTA title", name: "ctaTitle", widget: "string" }
          - label: "Architecture"
            name: "architecture"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Lead", name: "lead", widget: "text" }
              - label: "Principles"
                name: "principles"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Text", name: "text", widget: "text" }
              - { label: "Layers title", name: "layersTitle", widget: "string" }
              - label: "Layers"
                name: "layers"
                widget: "list"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Text", name: "text", widget: "text" }
              - { label: "CTA title", name: "ctaTitle", widget: "string" }
          - label: "Company"
            name: "company"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Lead", name: "lead", widget: "text" }
              - label: "Values"
                name: "values"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Text", name: "text", widget: "text" }
              - { label: "Operating model eyebrow", name: "operatingModelEyebrow", widget: "string" }
              - { label: "Operating model title", name: "operatingModelTitle", widget: "string" }
              - label: "Operating model"
                name: "operatingModel"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Text", name: "text", widget: "text" }
              - { label: "CTA title", name: "ctaTitle", widget: "string" }
          - label: "Use Cases"
            name: "useCases"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Lead", name: "lead", widget: "text" }
              - { label: "Challenge label", name: "challengeLabel", widget: "string" }
              - { label: "Platform answer label", name: "solutionLabel", widget: "string" }
              - label: "Cases"
                name: "cases"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Challenge", name: "problem", widget: "text" }
                  - { label: "Platform answer", name: "solution", widget: "text" }
                  - label: "Modules"
                    name: "modules"
                    widget: "list"
                    field: { label: "Module", name: "module", widget: "string" }
              - { label: "CTA title", name: "ctaTitle", widget: "string" }
          - label: "Status"
            name: "status"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Lead", name: "lead", widget: "text" }
              - { label: "Updated label", name: "updatedLabel", widget: "string" }
              - { label: "Summary title", name: "summaryTitle", widget: "string" }
              - label: "Services"
                name: "services"
                widget: "list"
                fields:
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Status", name: "status", widget: "string" }
                  - { label: "Text", name: "text", widget: "text" }
              - { label: "Note", name: "note", widget: "text" }
          - label: "Changelog"
            name: "changelog"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Lead", name: "lead", widget: "text" }
              - label: "Entries"
                name: "entries"
                widget: "list"
                fields:
                  - { label: "Date", name: "date", widget: "string" }
                  - { label: "Title", name: "title", widget: "string" }
                  - label: "Items"
                    name: "items"
                    widget: "list"
                    field: { label: "Item", name: "item", widget: "string" }
          - label: "FAQ"
            name: "faq"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Lead", name: "lead", widget: "text" }
              - label: "Items"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Question", name: "question", widget: "string" }
                  - { label: "Answer", name: "answer", widget: "text" }
          - label: "Contact"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Lead", name: "lead", widget: "text" }
              - { label: "Form action", name: "formAction", widget: "string" }
              - label: "Fields"
                name: "fields"
                widget: "object"
                fields:
                  - { label: "Name label", name: "nameLabel", widget: "string" }
                  - { label: "Name placeholder", name: "namePlaceholder", widget: "string" }
                  - { label: "Email label", name: "emailLabel", widget: "string" }
                  - { label: "Email placeholder", name: "emailPlaceholder", widget: "string" }
                  - { label: "Message label", name: "messageLabel", widget: "string" }
                  - { label: "Message placeholder", name: "messagePlaceholder", widget: "string" }
                  - { label: "Submit label", name: "submitLabel", widget: "string" }
      - label: "Module Detail Pages"
        name: "modulePages"
        file: "src/content/site/pt-BR/modulePages.json"
        fields: &modulePages_fields
          - label: "VoIP"
            name: "voip"
            widget: "object"
            fields: &module_page_fields
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Lead", name: "lead", widget: "text" }
              - { label: "Card title", name: "cardTitle", widget: "string" }
              - label: "Items"
                name: "items"
                widget: "list"
                field: { label: "Item", name: "item", widget: "string" }
              - { label: "CTA title", name: "ctaTitle", widget: "string" }
          - { label: "Hosting", name: "hosting", widget: "object", fields: *module_page_fields }
          - { label: "Monitoring", name: "monitoring", widget: "object", fields: *module_page_fields }
          - { label: "Cyber Security", name: "cyberSecurity", widget: "object", fields: *module_page_fields }
          - { label: "Support", name: "support", widget: "object", fields: *module_page_fields }
      - label: "Legal And Trust"
        name: "legal"
        file: "src/content/site/pt-BR/legal.json"
        fields: &legal_fields
          - label: "Trust Center"
            name: "trust"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Lead", name: "lead", widget: "text" }
              - label: "Cards"
                name: "cards"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Text", name: "text", widget: "text" }
              - { label: "Documents eyebrow", name: "documentsEyebrow", widget: "string" }
              - { label: "Links title", name: "linksTitle", widget: "string" }
              - { label: "Legal review title", name: "reviewTitle", widget: "string" }
              - { label: "Legal review note", name: "legalReviewNote", widget: "text" }
          - label: "Cookie Consent"
            name: "cookieConsent"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Accept all label", name: "acceptAllLabel", widget: "string" }
              - { label: "Reject label", name: "rejectLabel", widget: "string" }
              - { label: "Customize label", name: "customizeLabel", widget: "string" }
              - { label: "Save label", name: "saveLabel", widget: "string" }
              - { label: "Settings label", name: "settingsLabel", widget: "string" }
              - { label: "Close label", name: "closeLabel", widget: "string" }
              - label: "Categories"
                name: "categories"
                widget: "list"
                fields:
                  - { label: "Key", name: "key", widget: "string" }
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
                  - { label: "Required", name: "required", widget: "boolean", default: false }
          - label: "Legal Pages"
            name: "pages"
            widget: "object"
            fields:
              - label: "Privacy"
                name: "privacy"
                widget: "object"
                fields: &legal_page_fields
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
                  - { label: "Eyebrow", name: "eyebrow", widget: "string" }
                  - { label: "Heading", name: "heading", widget: "string" }
                  - { label: "Effective date", name: "effectiveDate", widget: "string" }
                  - { label: "Lead", name: "lead", widget: "text" }
                  - label: "Sections"
                    name: "sections"
                    widget: "list"
                    fields:
                      - { label: "Title", name: "title", widget: "string" }
                      - { label: "Body", name: "body", widget: "text" }
              - { label: "Cookies", name: "cookies", widget: "object", fields: *legal_page_fields }
              - { label: "Terms", name: "terms", widget: "object", fields: *legal_page_fields }
              - { label: "Data Processing", name: "dataProcessing", widget: "object", fields: *legal_page_fields }
              - { label: "Subprocessors", name: "subprocessors", widget: "object", fields: *legal_page_fields }
  - name: "site_en_us"
    label: "Site Content - English (en-US)"
    files:
      - label: "Global Settings"
        name: "settings"
        file: "src/content/site/en-US/settings.json"
        fields: *settings_fields
      - label: "Home Page"
        name: "home"
        file: "src/content/site/en-US/home.json"
        fields: *home_fields
      - label: "Product Modules"
        name: "modules"
        file: "src/content/site/en-US/modules.json"
        fields: *modules_fields
      - label: "Core Pages"
        name: "pages"
        file: "src/content/site/en-US/pages.json"
        fields: *pages_fields
      - label: "Module Detail Pages"
        name: "modulePages"
        file: "src/content/site/en-US/modulePages.json"
