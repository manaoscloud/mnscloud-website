backend:
  name: github
  repo: manaoscloud/mnscloud-website
  branch: main

local_backend: true
publish_mode: editorial_workflow

media_folder: "public/uploads"
public_folder: "/uploads"

site_url: "https://manaos.cloud"
display_url: "https://manaos.cloud"
logo_url: "/brand/mnscloud-logo.png"

collections:
  - name: "site"
    label: "Site Settings"
    files:
      - label: "Global Settings"
        name: "settings"
        file: "src/content/site/settings.json"
        fields:
          - label: "Site"
            name: "site"
            widget: "object"
            fields:
              - { label: "Site name", name: "name", widget: "string" }
              - { label: "Site URL", name: "url", widget: "string" }
              - { label: "Default title", name: "defaultTitle", widget: "string" }
              - { label: "Default description", name: "defaultDescription", widget: "text" }
              - { label: "Open Graph image", name: "ogImage", widget: "image", required: false }
          - label: "Brand"
            name: "brand"
            widget: "object"
            fields:
              - { label: "Light logo", name: "logoLight", widget: "image" }
              - { label: "Default logo", name: "logoDefault", widget: "image" }
              - { label: "Favicon", name: "favicon", widget: "image" }
              - { label: "Watermark", name: "watermark", widget: "image", required: false }
              - { label: "Hero image alt", name: "heroAlt", widget: "string" }
          - label: "Navigation"
            name: "navigation"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL", name: "href", widget: "string" }
          - label: "Header CTA"
            name: "headerCta"
            widget: "object"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL", name: "href", widget: "string" }
          - label: "Footer"
            name: "footer"
            widget: "object"
            fields:
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Copyright", name: "copyright", widget: "string" }
              - { label: "Note", name: "note", widget: "string" }
          - label: "Global CTA"
            name: "globalCta"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Button label", name: "buttonLabel", widget: "string" }
              - { label: "Button URL", name: "buttonHref", widget: "string" }
      - label: "Home Page"
        name: "home"
        file: "src/content/site/home.json"
        fields:
          - { label: "SEO title", name: "seoTitle", widget: "string" }
          - { label: "SEO description", name: "seoDescription", widget: "text" }
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - label: "Primary action"
                name: "primaryAction"
                widget: "object"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "URL", name: "href", widget: "string" }
              - label: "Secondary action"
                name: "secondaryAction"
                widget: "object"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "URL", name: "href", widget: "string" }
              - label: "Panel rows"
                name: "panelRows"
                widget: "list"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Value", name: "value", widget: "string" }
          - label: "Modules section"
            name: "modulesSection"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - label: "Architecture band"
            name: "architectureBand"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - label: "Blog section"
            name: "blogSection"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "All posts title", name: "allPostsTitle", widget: "string" }
              - { label: "All posts text", name: "allPostsText", widget: "text" }
      - label: "Product Modules"
        name: "modules"
        file: "src/content/site/modules.json"
        fields:
          - label: "Modules"
            name: "modules"
            widget: "list"
            fields:
              - { label: "Slug", name: "slug", widget: "string" }
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Summary", name: "summary", widget: "text" }
              - { label: "URL", name: "href", widget: "string" }
              - label: "Features"
                name: "features"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
      - label: "Core Pages"
        name: "pages"
        file: "src/content/site/pages.json"
        fields:
          - label: "Blog"
            name: "blog"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Lead", name: "lead", widget: "text" }
              - { label: "Back label", name: "backLabel", widget: "string" }
              - { label: "Article eyebrow", name: "articleEyebrow", widget: "string" }
              - { label: "Article CTA title", name: "articleCtaTitle", widget: "string" }
          - label: "API Docs"
            name: "docs"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Lead", name: "lead", widget: "text" }
              - label: "Primary action"
                name: "primaryAction"
                widget: "object"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "URL", name: "href", widget: "string" }
              - label: "Secondary action"
                name: "secondaryAction"
                widget: "object"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "URL", name: "href", widget: "string" }
              - { label: "Surfaces title", name: "surfacesTitle", widget: "string" }
              - label: "Surfaces"
                name: "surfaces"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Text", name: "text", widget: "string" }
              - { label: "Section eyebrow", name: "sectionEyebrow", widget: "string" }
              - { label: "Section title", name: "sectionTitle", widget: "string" }
              - { label: "Section text", name: "sectionText", widget: "text" }
              - label: "Cards"
                name: "cards"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Text", name: "text", widget: "text" }
              - { label: "CTA title", name: "ctaTitle", widget: "string" }
          - label: "Developers"
            name: "developers"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Lead", name: "lead", widget: "text" }
              - label: "Repositories"
                name: "repositories"
                widget: "list"
                fields:
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
                  - { label: "URL", name: "url", widget: "string" }
              - { label: "Governance eyebrow", name: "governanceEyebrow", widget: "string" }
              - { label: "Governance title", name: "governanceTitle", widget: "string" }
              - { label: "Governance text", name: "governanceText", widget: "text" }
              - { label: "Boundary title", name: "boundaryTitle", widget: "string" }
              - { label: "Boundary text", name: "boundaryText", widget: "text" }
              - { label: "CTA title", name: "ctaTitle", widget: "string" }
          - label: "Security"
            name: "security"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Lead", name: "lead", widget: "text" }
              - label: "Cards"
                name: "cards"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Text", name: "text", widget: "text" }
              - { label: "CTA title", name: "ctaTitle", widget: "string" }
          - label: "Contact"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Lead", name: "lead", widget: "text" }
              - { label: "Form action", name: "formAction", widget: "string" }
              - label: "Fields"
                name: "fields"
                widget: "object"
                fields:
                  - { label: "Name label", name: "nameLabel", widget: "string" }
                  - { label: "Name placeholder", name: "namePlaceholder", widget: "string" }
                  - { label: "Email label", name: "emailLabel", widget: "string" }
                  - { label: "Email placeholder", name: "emailPlaceholder", widget: "string" }
                  - { label: "Message label", name: "messageLabel", widget: "string" }
                  - { label: "Message placeholder", name: "messagePlaceholder", widget: "string" }
                  - { label: "Submit label", name: "submitLabel", widget: "string" }
      - label: "Module Detail Pages"
        name: "modulePages"
        file: "src/content/site/modulePages.json"
        fields:
          - label: "VoIP"
            name: "voip"
            widget: "object"
            fields: &module_page_fields
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Lead", name: "lead", widget: "text" }
              - { label: "Card title", name: "cardTitle", widget: "string" }
              - label: "Items"
                name: "items"
                widget: "list"
                field: { label: "Item", name: "item", widget: "string" }
              - { label: "CTA title", name: "ctaTitle", widget: "string" }
          - { label: "Hosting", name: "hosting", widget: "object", fields: *module_page_fields }
          - { label: "Monitoring", name: "monitoring", widget: "object", fields: *module_page_fields }
          - { label: "Cyber Security", name: "cyberSecurity", widget: "object", fields: *module_page_fields }
          - { label: "Support", name: "support", widget: "object", fields: *module_page_fields }
  - name: "blog"
    label: "Blog"
    label_singular: "Blog Post"
    folder: "src/content/blog"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    preview_path: "blog/{{slug}}"
    summary: "{{title}} - {{date}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Publish date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Author", name: "author", widget: "string", default: "MNSCloud" }
      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
        field: { label: "Tag", name: "tag", widget: "string" }
      - label: "Status"
        name: "status"
        widget: "select"
        default: "draft"
        options:
          - { label: "Draft", value: "draft" }
          - { label: "Published", value: "published" }
      - { label: "Featured", name: "featured", widget: "boolean", default: false, required: false }
      - { label: "Cover image", name: "image", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
